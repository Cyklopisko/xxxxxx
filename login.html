<!doctype html>
<html lang="en" class="dawvq-fonts dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="/_next/static/css/93278b125acf3f15.css"
      data-precedence="next"
    />
    <link
      rel="stylesheet"
      href="/_next/static/css/d5383b2b6a78b4ae.css"
      data-precedence="next"
    />
    <link
      rel="stylesheet"
      href="/_next/static/css/d3a83a051155dc96.css"
      data-precedence="next"
    />
    <title>Sign in - dawvq</title>
    <meta
      name="description"
      content="Access AI models through one API workspace. Manage API keys, set usage limits, track token costs and connect your development tools with dawvq."
    />
    <meta name="application-name" content="dawvq" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      href="/icon.png?68129ce886cd9899"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-icon.png?55eeed6020c84e8f"
      type="image/png"
      sizes="180x180"
    />
  </head>
  <body
    class="font-sans antialiased bg-background text-foreground min-h-screen"
  >
    <div hidden=""><!--$--><!--/$--></div>
    <main class="access-shell">
      <div class="access-layout">
        <section
          class="access-visual"
          aria-label="dawvq workspace introduction"
          style="opacity: 0; transform: translateX(-22px)"
        >
          <div class="access-visual-art" aria-hidden="true">
            <div
              class=""
              style="
                position: relative;
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: #010103;
              "
            >
              <canvas
                style="
                  position: absolute;
                  inset: 0;
                  width: 100%;
                  height: 100%;
                  display: block;
                  pointer-events: none;
                "
              ></canvas>
            </div>
          </div>
          <div class="access-visual-copy">
            <span class="access-eyebrow">YOUR AI WORKSPACE</span>
            <h1>One workspace.<br />Keep <em>building.</em></h1>
            <p>Your models, API keys and usage. All in one place.</p>
          </div>
        </section>
        <section
          class="access-panel"
          style="opacity: 0; transform: translateX(22px)"
        >
          <div class="access-card">
            <div class="access-card-top">
              <a class="access-logo" href="/" aria-label="dawvq.com home"
                ><svg
                  width="26"
                  height="26"
                  viewBox="0 0 28 28"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M14 3 23.5 8.5v11L14 25l-9.5-5.5v-11L14 3Z"
                    stroke="currentColor"
                    stroke-width="1.5"
                  ></path>
                  <path
                    d="m14 8 5 3v6l-5 3-5-3v-6l5-3Zm0-5v5m9.5.5-4.5 2.5m4.5 8.5L19 17M14 25v-5m-9.5-.5L9 17M4.5 8.5 9 11"
                    stroke="currentColor"
                    stroke-width="1.5"
                  ></path></svg
                ><span>dawvq.com</span></a
              ><a href="/" class="access-back"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-arrow-left"
                  aria-hidden="true"
                >
                  <path d="m12 19-7-7 7-7"></path>
                  <path d="M19 12H5"></path>
                </svg>
                Back</a
              >
            </div>
            <h2>Welcome back</h2>
            <p class="access-description">
              Sign in to access your workspace and manage your profile.
            </p>
            <form class="access-form">
              <label for="login-identifier">Login</label>
              <div class="access-input-wrap">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-user-round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="8" r="5"></circle>
                  <path d="M20 21a8 8 0 0 0-16 0"></path></svg
                ><input
                  id="login-identifier"
                  type="text"
                  autocomplete="username"
                  placeholder="Your login"
                  required=""
                  value=""
                />
              </div>
              <label for="login-password">Password</label>
              <div class="access-input-wrap">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-lock-keyhole"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="16" r="1"></circle>
                  <rect x="3" y="10" width="18" height="12" rx="2"></rect>
                  <path d="M7 10V7a5 5 0 0 1 10 0v3"></path></svg
                ><input
                  id="login-password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  required=""
                  value=""
                /><button
                  class="access-input-action"
                  type="button"
                  aria-label="Show password"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-eye"
                    aria-hidden="true"
                  >
                    <path
                      d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
              <label class="access-captcha" aria-live="polite"
                ><input type="checkbox" /><span
                  class="access-captcha-box"
                  aria-hidden="true"
                ></span
                ><span style="opacity: 0; transform: translateY(3px)"
                  >Confirm that you are not a robot</span
                ></label
              ><button class="access-primary" type="submit">
                Sign in
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-arrow-right"
                  aria-hidden="true"
                >
                  <path d="M5 12h14"></path>
                  <path d="m12 5 7 7-7 7"></path>
                </svg>
              </button>
            </form>
            <p class="access-switch">
              No account?<!-- -->
              <a href="/register">Sign up</a>
            </p>
          </div>
        </section>
      </div>
      <footer class="access-footer">
        <span
          >©
          <!-- -->2026<!-- -->
          dawvq.com</span
        ><span
          ><a href="/products">Products</a> ·
          <a href="/support">Support</a> ·<!-- -->
          <a href="/terms">Terms</a></span
        >
      </footer>
    </main>
    <!--$--><!--/$-->
    <script type="module" src="/app.js"></script>
  </body>
</html>
